{% set version = "0.4.0" %}

package:
  name: utide
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/U/UTide/utide-{{ version }}.tar.gz
  sha256: 5293fc10d52b37ff8092a2b99c20dbdd84b6a3e30dc8c013e28610491882ce55

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - numpy
    - scipy

test:
  imports:
    - utide
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/wesleybowman/UTide
  license: MIT
  license_file: LICENSE.txt
  summary: Python distribution of the MatLab package UTide

extra:
  recipe-maintainers:
    - ocefpaf
    - wesleybowman
